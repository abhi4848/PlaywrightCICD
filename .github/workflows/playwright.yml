name: Playwright Tests

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run tests daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to test'
        required: false
        default: '18.x'
        type: choice
        options:
          - 18.x
          - 20.x
          - 22.x

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.node-version)) || fromJSON('["18.x", "20.x"]') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: sh ./node_modules/.bin/playwright install --with-deps

      - name: Run Playwright tests
        run: sh ./node_modules/.bin/playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (blob format)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-node-${{ matrix.node-version }}
          path: blob-report
          retention-days: 1

  merge-reports:
    name: Merge reports
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*

      - name: Prepare downloaded blob reports
        run: |
          mkdir -p merged-blob-reports
          for dir in all-blob-reports/*; do
            if [ -d "$dir" ]; then
              cp -r "$dir/"* merged-blob-reports/ || true
            fi
          done
          echo "Merged blob report file list:"
          ls -la merged-blob-reports

      - name: Merge reports
        id: merge_reports
        run: |
          sh ./node_modules/.bin/playwright merge-reports --reporter html merged-blob-reports || true

      - name: Check generated HTML report
        id: check_report
        run: |
          if [ -d "playwright-report" ] && [ "$(ls -A playwright-report)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish HTML report to GitHub Pages
        if: steps.check_report.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: playwright-report
          user_name: github-actions
          user_email: github-actions@github.com
          keep_files: false

      - name: Upload HTML report
        if: steps.check_report.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: html-report-merged
          path: playwright-report
          retention-days: 14

      - name: Verify gh-pages branch exists
        if: steps.check_report.outputs.exists == 'true'
        run: |
          echo "Remote gh-pages branch info:" 
          git ls-remote --heads origin gh-pages || echo "gh-pages branch not found"
